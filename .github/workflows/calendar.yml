name: Update FXStreet calendar
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python fxstreet_scraper.py
        env:
          OUTPUT_PATH: ${{ github.workspace }}/fxstreet_calendar.json
      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add fxstreet_calendar.json
          git diff --staged --quiet || (git commit -m "Update calendar" && git push)
